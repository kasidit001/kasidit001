name: Update profile panels

on:
  schedule:
    - cron: "17 3 * * *"          # every day at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard library only: reads the public contribution graph and REST API, no token or extra packages needed.
      - name: Rebuild heatmap and info card
        run: |
          python scripts/build_heatmap.py
          python scripts/build_neofetch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap.svg assets/neofetch.svg
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "chore: refresh profile panels" && git push; fi
